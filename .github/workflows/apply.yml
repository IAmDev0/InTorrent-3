name: Apply InTorrent Prewarm Patch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to apply the patch to'
        required: true
        default: 'main'

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    # Permissions required to push changes back to the repository
    permissions:
      contents: write

    steps:
      # 1. Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0 

      # 2. Check if the patch file exists
      - name: Verify Patch File
        run: |
          if [ ! -f "intorrent-prewarm.patch" ]; then
            echo "❌ Error: intorrent-prewarm.patch not found in the root directory!"
            exit 1
          fi
          echo "✅ Patch file found."

      # 3. Apply the patch to the root directory
      - name: Apply Git Patch
        run: |
          git apply intorrent-prewarm.patch
          echo "✅ Patch applied successfully!"

      # 4. Configure Git and push the changes
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # Stage the modified files
          git add .
          
          # Only commit if there are actual changes to avoid workflow errors
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "chore: apply intorrent-prewarm.patch via GitHub Actions"
            git push origin ${{ github.event.inputs.branch }}
            echo "🚀 Changes successfully pushed back to ${{ github.event.inputs.branch }}!"
          fi
